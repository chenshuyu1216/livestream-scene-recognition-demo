name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile source
        run: python -m compileall -q livestream_scene_demo scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run end-to-end demo
        run: |
          python -m livestream_scene_demo.cli \
            --input data/sample_windows.jsonl \
            --output outputs/demo_predictions.jsonl
          python scripts/evaluate_demo.py data/sample_windows.jsonl

